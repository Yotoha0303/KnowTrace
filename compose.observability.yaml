x-observability-logging: &observability-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?Run scripts/linux/init-observability-env.sh first}
      # 注意：这里**不要**再设 KNOWTRACE_APP_REVISION。
      # 它的值必须是「构建这个镜像时的 git HEAD」，由 Dockerfile 的
      # ARG/ENV 在构建阶段烘进去（见 Dockerfile 的 builder 与 runner 阶段）。
      # 若在此处用运行时环境变量注入，重建与不重建会得到同一个值，
      # 「运行态版本核对」就永远报一致 —— 那正是它要发现的问题。
      # 2026-09-30 修正；原委见 docs/16-stage3-observability.md「运行态版本核对」。
    logging: *observability-logging

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ./runtime/node-exporter:/var/lib/node_exporter/textfile_collector:ro
    restart: unless-stopped
    mem_limit: 64m
    logging: *observability-logging

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.27.0
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./deploy/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    mem_limit: 64m
    logging: *observability-logging

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.28.1
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.json
      - --storage.path=/alertmanager
      - --data.retention=120h
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./runtime/alertmanager/alertmanager.json:/etc/alertmanager/alertmanager.json:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    restart: unless-stopped
    mem_limit: 128m
    logging: *observability-logging

  prometheus:
    image: quay.io/prometheus/prometheus:v3.5.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/rules:/etc/prometheus/rules:ro
      - ./runtime/prometheus/metrics.token:/etc/prometheus/secrets/metrics.token:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      auth:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      node-exporter:
        condition: service_started
      blackbox-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    restart: unless-stopped
    mem_limit: 320m
    logging: *observability-logging

  grafana:
    image: docker.io/grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/linux/init-observability-env.sh first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Grafana is reached through an SSH tunnel on local HTTP, never directly
      # from the public network, so a Secure cookie would prevent login.
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-3001}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      # Loki 只是另一个数据源，未就绪不该拦住 Grafana 启动
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped
    mem_limit: 384m
    logging: *observability-logging

  # ── 日志：Loki（替代 Elasticsearch）─────────────────────────────────
  # 为什么换：ELK 内存上限合计 700m(ES)+512m(Logstash)+768m(Kibana) ≈ 2 GB，
  # 在 1.8 GB 的机器上必须按需启停。Loki 无 JVM，内存需求低一个数量级，
  # 故与 Prometheus/Grafana 同等待遇：常驻、不设 profile。
  loki:
    image: docker.io/grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      # 只绑回环：供 verify 脚本从宿主机探 /ready，不对外
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    # 刻意不写 healthcheck：Loki 官方镜像的 base 未实测（重装的机器上暂无 docker），
    # 若镜像里没有 wget/curl，健康检查会永远失败 → depends_on: service_healthy
    # 会卡死整个监控栈。这个失败模式比"不检查"更糟。
    # 改为 service_started + 在 verify 脚本里断言 /ready 与一次真实 LogQL 查询。
    restart: unless-stopped
    mem_limit: 512m
    logging: *observability-logging

  # ── 采集：Alloy（替代 Logstash）────────────────────────────────────
  # 选 Alloy 而非 Promtail：实测 Promtail 最后发布 2026-05-13（已 3 个月无更新），
  # Alloy v1.20.1 为 2026-09-28 —— 官方推荐方向已明确。
  alloy:
    image: docker.io/grafana/alloy:v1.20.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 采集来源与原先 Logstash 的 pipeline 一一对应（见 config.alloy 顶部对照表）
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/caddy:/var/log/caddy:ro
      - /var/log/nginx:/var/log/nginx:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m
    logging: *observability-logging


volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  alloy_data:

# 原先这里有两个网络（logging-internal / logging-management），**专为 ELK 存在**：
# 实测 ELK 三个服务是唯一声明自定义网络的服务，其余（app/prometheus/grafana/
# alertmanager/exporter）都在默认网络。ELK 删除后它们没有使用者，故一并删除 ——
# Loki 与 Alloy 直接进默认网络，与 Grafana 天然互通（数据源用 http://loki:3100）。
