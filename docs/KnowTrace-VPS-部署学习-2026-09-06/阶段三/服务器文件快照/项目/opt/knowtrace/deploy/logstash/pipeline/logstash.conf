input {
  file {
    id => "caddy-access"
    path => ["/var/log/caddy/knowtrace-access.log"]
    start_position => "end"
    sincedb_path => "/usr/share/logstash/data/caddy-access.sincedb"
    codec => json
    tags => ["caddy-access"]
  }

  file {
    id => "nginx-access"
    path => ["/var/log/nginx/knowtrace.access.log"]
    start_position => "end"
    sincedb_path => "/usr/share/logstash/data/nginx-access.sincedb"
    tags => ["nginx-access"]
  }

  file {
    id => "nginx-error"
    path => ["/var/log/nginx/knowtrace.error.log"]
    start_position => "end"
    sincedb_path => "/usr/share/logstash/data/nginx-error.sincedb"
    tags => ["nginx-error"]
  }

  file {
    id => "docker-json"
    path => ["/var/lib/docker/containers/*/*-json.log"]
    start_position => "end"
    sincedb_path => "/usr/share/logstash/data/docker-json.sincedb"
    codec => json
    tags => ["docker-json"]
  }

  tcp {
    id => "verification-json"
    host => "0.0.0.0"
    port => 5000
    codec => json_lines
    tags => ["verification-json"]
  }
}

filter {
  if "caddy-access" in [tags] {
    mutate {
      add_field => { "[event][dataset]" => "caddy.access" }
      remove_field => [
        "[request][headers][Authorization]",
        "[request][headers][Cookie]",
        "[request][headers][Proxy-Authorization]"
      ]
    }
  }

  if "nginx-access" in [tags] {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    mutate {
      add_field => { "[event][dataset]" => "nginx.access" }
    }
  }

  if "nginx-error" in [tags] {
    mutate {
      add_field => { "[event][dataset]" => "nginx.error" }
    }
  }

  if "docker-json" in [tags] {
    mutate {
      rename => {
        "log" => "message"
        "time" => "docker_timestamp"
      }
      strip => ["message"]
      add_field => { "[event][dataset]" => "docker.container" }
    }
    if [log][file][path] {
      grok {
        match => { "[log][file][path]" => "/var/lib/docker/containers/%{DATA:[container][id]}/" }
      }
    }
  }

  if "verification-json" in [tags] {
    mutate {
      add_field => { "[event][dataset]" => "knowtrace.verification" }
    }
  }

}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "knowtrace-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }
}
