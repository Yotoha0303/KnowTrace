# Ansible 配置 —— Day 0 宿主机阶段（四层职责见 ../README.md）
#
# 这份配置服务的是「在目标机上就地跑」的用法，见 site.yml 头部。
# 因为 connection 是 local，这里**不需要 inventory**：不存在被连接的远端主机，
# 服务器地址/端口/私钥路径也就都不需要入库（上游仓库是 public 的）。
[defaults]
roles_path         = roles
retry_files_enabled = False
# 目标机是 Ubuntu 24.04，python3 一定在；auto_silent 避免每次刷一句发现信息
interpreter_python = auto_silent
# 就地跑，输出里不需要控制端主机名
display_skipped_hosts = False
