# Loki 单机配置（本地文件系统）—— 2026-10-03 替代 Elasticsearch
#
# 资源定位：原 ELK 要 700m(ES)+512m(Logstash)+768m(Kibana) ≈ 2 GB 内存上限，
# 在 1.8 GB 的机器上必须按需启停。Loki 单进程、无 JVM，实测内存需求低一个数量级，
# 因此改为常驻（与 Prometheus/Grafana 同等待遇）。
auth_enabled: false

server:
  http_listen_port: 3100
  # 仅被同网络的 Grafana/Alloy 访问，且只在 Docker 内网，不发布到宿主机公网
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# 保留期：与原先 ELK 的 7 天 ILM 对齐。
# 2 vCPU / 1.8 GB 的机器上磁盘有限（实测可用约 39 G），7 天够排查回看。
limits_config:
  retention_period: 168h
  # 单条日志上限调大一些：Caddy 的 JSON 访问日志带完整 UA 与头，默认 256 KB 偶有截断
  max_line_size: 512KB
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
