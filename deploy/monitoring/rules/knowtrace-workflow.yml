groups:
  - name: knowtrace.availability
    rules:
      - alert: KnowTraceMetricsTargetDown
        expr: up{job=~"knowtrace-app|knowtrace-auth|node-exporter|blackbox-exporter|alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} metrics target is down"
          runbook: "docs/16-stage3-observability.md#target-down"

      - alert: KnowTraceHttpProbeFailed
        expr: probe_success{job=~"knowtrace-http-internal|knowtrace-http-public"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HTTP probe failed for {{ $labels.instance }}"
          runbook: "docs/16-stage3-observability.md#http-probe-failed"

      - alert: KnowTraceDatabaseNotReady
        expr: knowtrace_database_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "KnowTrace-Workflow PostgreSQL readiness is failing"
          runbook: "docs/16-stage3-observability.md#database-not-ready"

      - alert: KnowTraceAuthNotReady
        expr: go_user_system_readiness == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "KnowTrace-Workflow authentication service is not ready"
          runbook: "docs/16-stage3-observability.md#auth-not-ready"

      - alert: KnowTraceRequestErrors
        expr: increase(knowtrace_request_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "KnowTrace-Workflow captured server request errors"
          runbook: "docs/16-stage3-observability.md#request-errors"

  - name: knowtrace.host
    rules:
      - alert: HostHighCpuUsage
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "VPS CPU usage has exceeded 90 percent"
          runbook: "docs/16-stage3-observability.md#host-capacity"

      - alert: HostLowAvailableMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VPS available memory is below 10 percent"
          runbook: "docs/16-stage3-observability.md#host-capacity"

      - alert: HostSwapUsageHigh
        expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / clamp_min(node_memory_SwapTotal_bytes, 1) > 0.50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "VPS swap usage is above 50 percent"
          runbook: "docs/16-stage3-observability.md#host-capacity"

      - alert: HostLowRootDiskSpace
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "VPS root filesystem free space is below 15 percent"
          runbook: "docs/16-stage3-observability.md#host-capacity"

      - alert: HostRootFilesystemReadOnly
        expr: node_filesystem_readonly{mountpoint="/",fstype!~"tmpfs|overlay"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "VPS root filesystem is read-only"
          runbook: "docs/16-stage3-observability.md#host-capacity"

      - alert: KnowTraceBackupMissing
        expr: knowtrace_backup_archive_count < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No complete KnowTrace-Workflow backup archive is present"
          runbook: "docs/16-stage3-observability.md#backup-freshness"

      - alert: KnowTraceBackupStale
        expr: time() - knowtrace_backup_last_success_timestamp_seconds > 93600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The newest KnowTrace-Workflow backup is older than 26 hours"
          runbook: "docs/16-stage3-observability.md#backup-freshness"

  # 异地备份（scripts/linux/offsite-backup.sh 写的三个指标）
  # 与存储商无关：无论后端是 R2 / S3 / OSS / COS / 另一台机器，
  # 只要走 offsite-backup.sh，这三个指标的名字和语义都一样。
  - name: knowtrace.offsite-backup
    rules:
      # 尚未配置异地备份。用 absent() 表达「这个能力完全不存在」——
      # 这正是「静默缺失」的形态：不报错、不失败，只是没有。
      # severity=info 且 Alertmanager 的 local-only 子路由会拦下它，
      # 所以它进 UI 不进邮箱，不会变成每天一封的噪声。
      - alert: KnowTraceOffsiteBackupNotConfigured
        expr: absent(knowtrace_offsite_backup_archive_count)
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "Offsite backup is not configured; all backups are on the same disk"
          runbook: "docs/16-stage3-observability.md#offsite-backup"

      - alert: KnowTraceOffsiteBackupMissing
        expr: knowtrace_offsite_backup_archive_count < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No encrypted offsite backup archive is present"
          runbook: "docs/16-stage3-observability.md#offsite-backup"

      # 阈值 30h：本地备份每天 03:20 一次，异地在 04:10 跟一次。
      # 给两次完整的日周期余量，避免一次网络抖动就告警。
      - alert: KnowTraceOffsiteBackupStale
        expr: time() - knowtrace_offsite_backup_last_success_timestamp_seconds > 108000
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The newest offsite backup upload is older than 30 hours"
          runbook: "docs/16-stage3-observability.md#offsite-backup"

  # 巡检结论（scripts/linux/write-ops-metrics.sh 写的指标）
  # 修的是「最大的传导断裂」：巡检跑完只写报告，没人定时看。
  # 运行态版本一致性。
  # 指标由 scripts/linux/write-revision-metrics.sh 写入，由 knowtrace-workflow-daily-ops.service
  # 的第二个 ExecStartPost 调用（在 write-ops-metrics.sh 之后）。
  #
  # 修的是 2026-09-29 生态观察的 F-01：部署目录 HEAD 是 47a4c20，
  # 而运行中容器自报 revision 是 7ce26f7d（差 37 提交），
  # 当时 4 层健康检查 / 12 个抓取目标 / 20+ 条规则 / 整份巡检报告**全部正常** ——
  # 因为整套体系验证的是「可用性」，没有一条验证「同一性」。
  - name: knowtrace.revision
    rules:
      # 不一致 **且差异里有应用代码** —— 这才是要叫醒人的情况。
      # 只看 match == 0 会误报：只改 docs 的提交也会让两者不等，而应用行为完全相同。
      # 每次文档提交都告警，很快就被训练成忽略它（参见素材 A17）。
      - alert: KnowTraceAppRevisionMismatch
        expr: knowtrace_app_revision_match == 0 and knowtrace_app_revision_app_changed_files > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Running app revision differs from deploy HEAD and app code changed"
          runbook: "docs/16-stage3-observability.md#revision"

      # 不一致，但差异里**没有**应用代码（只改了 docs/运维脚本等）。事实记录，不打扰。
      - alert: KnowTraceAppRevisionBehindDocsOnly
        expr: knowtrace_app_revision_match == 0 and knowtrace_app_revision_app_changed_files == 0
        for: 26h
        labels:
          severity: info
        annotations:
          summary: "Running app revision is behind deploy HEAD, but only non-app files changed"
          runbook: "docs/16-stage3-observability.md#revision"

      # 「核对再也没跑成功过」。判定失败时不写 match 样本，
      # 这个 absent 就会命中 —— 与 KnowTraceOpsCheckNeverRan 同一手法。
      - alert: KnowTraceAppRevisionCheckNotRunning
        expr: absent(knowtrace_app_revision_match)
        for: 26h
        labels:
          severity: info
        annotations:
          summary: "The running-app revision check has not produced a result"
          runbook: "docs/16-stage3-observability.md#revision"

      # 「跑了但判定不了」。用 max by (reason) 只留被置为 1 的那一个原因。
      - alert: KnowTraceAppRevisionUndetermined
        expr: max by (reason) (knowtrace_app_revision_undetermined) == 1
        for: 26h
        labels:
          severity: info
        annotations:
          summary: "Running-app revision could not be determined (reason={{ $labels.reason }})"
          runbook: "docs/16-stage3-observability.md#revision"

  - name: knowtrace.ops-check
    rules:
      # 巡检报出 FAIL —— 这是整条链路的目的所在
      - alert: KnowTraceOpsCheckFailed
        expr: knowtrace_ops_report_worst_level >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Ops check {{ $labels.script }} reported FAIL findings"
          runbook: "docs/16-stage3-observability.md#ops-check"

      # 「巡检从未运行过」。用 absent() 而不是 < 0，
      # 因为脚本从未生成报告时不输出样本 —— 这正是静默缺失的形态。
      # 三个单元装了但定时器没 enable、或报告目录被清空，都会命中这条。
      - alert: KnowTraceOpsCheckNeverRan
        expr: absent(knowtrace_ops_report_timestamp_seconds)
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "Ops checks have never produced a report"
          runbook: "docs/16-stage3-observability.md#ops-check"

      # 「定时器停了」。按各自周期给足余量，避免一次抖动就告警：
      # 日巡检 26 小时（一天 + 2 小时余量）
      - alert: KnowTraceOpsDailyCheckStale
        expr: time() - knowtrace_ops_report_timestamp_seconds{script="daily-ops"} > 93600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The daily ops check has not run for over 26 hours"
          runbook: "docs/16-stage3-observability.md#ops-check"

      # 周巡检 8 天（周一跑，给一周 + 1 天余量）
      - alert: KnowTraceOpsWeeklyCheckStale
        expr: time() - knowtrace_ops_report_timestamp_seconds{script="weekly-check"} > 691200
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The weekly ops check has not run for over 8 days"
          runbook: "docs/16-stage3-observability.md#ops-check"

      # 月巡检 35 天
      - alert: KnowTraceOpsMonthlyCheckStale
        expr: time() - knowtrace_ops_report_timestamp_seconds{script="monthly-ops"} > 3024000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The monthly ops check has not run for over 35 days"
          runbook: "docs/16-stage3-observability.md#ops-check"

  # TLS 证书到期。
  # 指标由 blackbox-exporter 的 https 探测直接给出，不需要额外脚本 ——
  # 周巡检查得到证书剩余天数，但结论进不了告警，这条规则补上。
  - name: knowtrace.tls
    rules:
      # Let's Encrypt 证书 90 天有效，Caddy 在到期前约 30 天自动续期。
      # 剩不到 21 天说明自动续期很可能已经失败。
      - alert: KnowTraceCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 21
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires in under 21 days (auto-renewal may have failed)"
          runbook: "docs/16-stage3-observability.md#tls-certificate"

      - alert: KnowTraceCertificateCritical
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 7
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate expires in under 7 days"
          runbook: "docs/16-stage3-observability.md#tls-certificate"

  - name: knowtrace.auth-http
    rules:
      - alert: GoUserSystemHigh5xxRate
        expr: |
          sum(rate(go_user_system_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(go_user_system_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Authentication 5xx rate is above 5 percent"
          runbook: "docs/16-stage3-observability.md#auth-http"

      - alert: GoUserSystemHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(go_user_system_http_request_duration_seconds_bucket[10m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Authentication p95 latency is above one second"
          runbook: "docs/16-stage3-observability.md#auth-http"

  - name: prometheus.self
    rules:
      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rule evaluations are failing"
          runbook: "docs/16-stage3-observability.md#prometheus-self"
